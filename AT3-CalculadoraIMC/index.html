<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC | Descubra seu Índice de Massa Corporal</title>
    <meta name="description"
        content="Calcule seu IMC de forma rápida e fácil com nossa calculadora online em tons pastel.">

    <!-- Chamada do arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
    <!-- 3. Favicon (Ícone da aba do navegador) -->
    <link rel="icon" type="image/x-icon" href="img/icon.png">

</head>

<body>

    <div class="container">
        <h2>Calculadora de IMC</h2>

        <div class="radio-group">
            <label class="radio-option">
                <input type="radio" name="publico" value="adulto" checked> Adulto
            </label>
            <label class="radio-option">
                <input type="radio" name="publico" value="crianca"> Criança
            </label>
        </div>

        <div class="radio-group" style="margin-bottom: 25px;">
            <label class="radio-option">
                <input type="radio" name="sexo" value="masculino" checked> Homem
            </label>
            <label class="radio-option">
                <input type="radio" name="sexo" value="feminino"> Mulher
            </label>
        </div>

        <div class="input-group">
            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" step="0.1" placeholder="Ex: 70" required>
        </div>

        <div class="input-group">
            <label for="altura">Altura (m):</label>
            <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75" required>
        </div>

        <button onclick="calcularIMC()">Calcular</button>

        <div id="resultado"></div>
    </div>

    <!-- Chamada do arquivo JS externo -->
    <script src="script.js"></script>
</body>

</html>
